name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the package and its dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install the PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          # The letter tests compile a real PDF and read its text layer back, so both
          # halves are installed here: without them those tests skip and the renderer
          # goes untested in CI.
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/tectonic

      - name: Run the suite
        run: python -m pytest -q
